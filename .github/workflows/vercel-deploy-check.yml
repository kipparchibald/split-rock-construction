# Smoke-tests production and (when secrets exist) polls Vercel for deploy READY state.
# Does NOT deploy — use deploy-vercel.yml (or Git integration) to ship.
#
# Without Vercel secrets: HTTP smoke test against PRODUCTION_URL (default splitrockconst.com).
# With secrets: full Vercel API check + smoke test.
#
# Optional secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — https://vercel.com/account/tokens
#   VERCEL_ORG_ID      — team_ZEZVchkfVnLrlfIFcBD32tFl (voxli)
#   VERCEL_PROJECT_ID  — prj_… from split-rock-construction-kx9x (NOT stale split-rock-construction)
#
# Optional repo variables:
#   PRODUCTION_URL     — e.g. https://splitrockconst.com (smoke target; default when unset)

name: Vercel production check

on:
  pull_request:
    branches: [main]
  schedule:
    # Every 6 hours
    - cron: "15 */6 * * *"
  workflow_dispatch:
  # Allow other workflows (e.g. deploy) to trigger a re-check
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_ORG_ID:
        required: false
      VERCEL_PROJECT_ID:
        required: false

concurrency:
  group: vercel-prod-check
  cancel-in-progress: true

jobs:
  check:
    name: Production READY + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          DEPLOY_URL: ${{ vars.PRODUCTION_URL }}
          SKIP_WAIT: "1"
          ALLOW_SSO: "1"
          REQUIRE_TEXT: "Split Rock"
        run: node scripts/check-vercel-deploy.mjs
